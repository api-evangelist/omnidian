aid: omnidian
name: Omnidian
description: 'Omnidian, Inc. is a Seattle-based clean energy performance assurance company,
  founded in 2015, that protects and accelerates investments in residential and commercial
  solar and battery storage. Its proprietary, machine-learning driven software platform
  continuously monitors distributed solar assets, diagnoses hardware, communication and
  environmental faults such as soiling, shading and snow, dispatches a nationwide field
  service technician network across 48 states, Washington D.C. and Puerto Rico, and
  underwrites a 95% energy production guarantee that reimburses owners for covered
  shortfalls. Omnidian serves installers, EPCs, developers, IPPs, solar financing providers,
  commercial real estate owners and asset investors, and is a Certified B Corporation and
  a member of the SunSpec Alliance. Its monitoring platform, client portal and field service
  partner portal are operated as private, authenticated systems; Omnidian publishes no
  public developer program, API documentation, or machine-readable API contract.'
